# CI dirender dari SPEC.json (stack.ecosystems dan stack.commands).
# Perintah harus identik dengan docs/EVALS.md, docs/TESTING.md, dan AGENTS.md.
# Periksa versi action terbaru tiap semester; untuk produksi pin action ke SHA commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Instal dependensi
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tes
        run: npm test
      - name: Build
        run: npm run build
